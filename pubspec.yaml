name: size_matter_swt
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.2+19

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  auto_animated: ^3.2.0
  flutter_displaymode: ^0.7.0
  get: ^4.7.2
  get_storage: ^2.1.1
  provider: ^6.1.5+1
  flutter_screenutil: ^5.9.3
  rxdart: ^0.28.0
  dio: ^5.9.0
  intl: ^0.20.2
  device_info_plus: ^13.2.0
  get_it: ^9.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.2.1
  camera: ^0.12.0+1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  video_player: ^2.11.1
  path: ^1.9.1
  carousel_slider: ^5.1.1
  lottie: ^3.3.2
  record: ^6.1.2
  just_audio: ^0.10.5
  audio_waveforms: ^2.0.2
  audioplayers: ^6.5.1
  image_picker: ^1.2.1
  flutter_doc_scanner: ^0.0.16
  photo_view: ^0.15.0
  flick_video_player: ^0.9.0
  flutter_widget_from_html: ^0.17.1
  url_launcher: ^6.3.2
  smooth_page_indicator: ^2.0.1
  pinput: ^6.0.1
  device_preview: ^1.3.1
  flutter_html: ^3.0.0
  intl_phone_field: ^3.2.0
  dropdown_button2: ^3.1.0
