  google_maps_flutter: ^2.14.0
  fluttertoast: ^9.0.0
  pretty_dio_logger: ^1.4.0
  geolocator: ^14.0.3
  flutter_polyline_points: ^3.1.0
  shimmer_animation: ^2.2.2+1
  firebase_core: ^4.9.0
  google_sign_in: ^7.2.0
  firebase_auth: ^6.5.2
  sign_in_with_apple: ^8.1.0
  purchases_flutter: ^10.4.1
  linear_progress_bar: ^3.0.0
  

dev_dependencies:
  dependency_validator: ^5.0.3
  build_runner: ^2.4.9
  flutter_gen_runner: ^5.6.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_gen:
  output: lib/gen/
  line_length: 80

  colors:
    inputs:
      - assets/colors/colors.xml
    outputs:
      class_name: AppColors


flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/lottie/
    - assets/colors/
  
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist.ttf
  

